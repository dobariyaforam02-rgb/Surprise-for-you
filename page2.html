<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #d92535;
      font-family: Georgia, serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hearts in the background */
    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.25);
      font-size: 25px;
      animation: float 5s infinite ease-in-out;
    }

    .h1 { top: 10%; left: 10%; }
    .h2 { top: 25%; right: 10%; }
    .h3 { bottom: 20%; left: 8%; }
    .h4 { bottom: 10%; right: 15%; }
    .h5 { top: 45%; left: 20%; }
    .h6 { top: 60%; right: 20%; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    /* Main birthday card */
    .birthday-card {
      position: relative;
      width: 90%;
      max-width: 550px;
      min-height: 500px;
      background: #e93645;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    /* Envelope */
    .envelope {
      width: 280px;
      height: 190px;
      background: #fff;
      position: relative;
      margin-top: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .envelope::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid #f4f4f4;
      z-index: 2;
    }

    .envelope::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      border-left: 140px solid #eeeeee;
      border-top: 95px solid transparent;
      border-right: 140px solid #eeeeee;
    }

    /* Birthday paper */
    .letter {
      position: absolute;
      z-index: 5;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 130px;
      background: white;
      padding: 30px 10px;
      text-align: center;
      color: #555;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
    }

    .letter span {
      display: block;
      font-size: 25px;
      margin-bottom: 10px;
    }

    /* Camera */
    .camera {
      position: absolute;
      left: 50px;
      bottom: 90px;
      width: 80px;
      height: 55px;
      background: #eee;
      border-radius: 8px;
      transform: rotate(-5deg);
      box-shadow: 0 5px 10px rgba(0,0,0,.15);
    }

    .camera::before {
      content: "";
      position: absolute;
      width: 32px;
      height: 32px;
      background: #222;
      border-radius: 50%;
      left: 24px;
      top: 12px;
      box-shadow: inset 0 0 0 6px #777;
    }

    .camera::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 8px;
      background: #bbb;
      top: -7px;
      left: 10px;
    }

    /* Flowers */
    .flowers {
      position: absolute;
      right: 30px;
      bottom: 70px;
      font-size: 65px;
      transform: rotate(-10deg);
    }

    .flower-text {
      position: absolute;
      right: 35px;
      bottom: 45px;
      font-size: 30px;
    }

    /* Click text */
    .click {
      margin-top: 45px;
      color: white;
      font-size: 17px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .5;
      }
    }

    /* Back button */
    .back {
      position: absolute;
      top: 20px;
      left: 20px;
      border: none;
      background: rgba(255,255,255,.2);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    @media(max-width: 500px) {

      .envelope {
        width: 230px;
        height: 160px;
      }

      .envelope::before {
        border-left-width: 115px;
        border-right-width: 115px;
        border-top-width: 80px;
      }

      .envelope::after {
        border-left-width: 115px;
        border-right-width: 115px;
        border-top-width: 80px;
      }

      .letter {
        width: 150px;
        height: 110px;
        font-size: 15px;
      }

      .camera {
        left: 25px;
        bottom: 80px;
        transform: scale(.7);
      }

      .flowers {
        right: 15px;
        bottom: 70px;
        font-size: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="heart h1">♥️</div>
    <div class="heart h2">♥️</div>
    <div class="heart h3">♥️</div>
    <div class="heart h4">♥️</div>
    <div class="heart h5">♥️</div>
    <div class="heart h6">♥️</div>

    <button class="back" onclick="window.location.href='index.html'">
      ← Back
    </button>

    <div class="birthday-card">

      <div class="envelope">

        <div class="letter">
          <span>♥️</span>
          Happy<br>
          Birthday
        </div>

      </div>

      <div class="camera"></div>

      <div class="flowers">💐</div>

      <div class="click" onclick="showMessage()">
        click me! ❤️
      </div>

    </div>

  </div>

  <script>
    function showMessage() {
      alert("Happy Birthday! ❤️ I hope you have the most beautiful day!");
    }
  </script>

</body>
</html>
